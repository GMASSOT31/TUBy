guide: "Création pas à pas d'un site web simple grâce à l'IA"
chapitres:

- titre: "Chapitre 0 · Préparer tes outils"
  objectif: "Avoir tous les comptes et réglages prêts. À faire une seule fois."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "J'ai un ordinateur connecté à internet"
    - "Le navigateur Google Chrome est installé"
    - "J'ai une adresse Gmail (elle sert à créer les comptes en 2 clics)"
    - "Un parent est d'accord et disponible : les comptes sont à son nom"
    - "On a un abonnement Claude Pro (minimum)"
  - type: action
    titre: "Connecte-toi à Claude"
    objectif: "Être sur Claude avec le compte Pro."
    quoi: "Ouvre claude.ai dans Chrome et connecte-toi avec le compte Pro de ton parent."
  - type: action
    titre: "Compte GitHub"
    objectif: "GitHub, c'est le coffre où sera rangé le code de tes sites."
    quoi: "Va sur github.com, clique « Sign up » puis « Continue with Google ». Déjà fait hier ? Réponds Oui."
  - type: action
    titre: "Compte Cloudflare"
    objectif: "Cloudflare met ton site en ligne gratuitement et garde sa mémoire (messages, réservations)."
    quoi: "Va sur dash.cloudflare.com et crée un compte avec Google. Choisis toujours le plan gratuit (Free). Déjà fait hier ? Réponds Oui."
  - type: action
    titre: "Relie GitHub à Claude Code"
    objectif: "Autoriser Claude à écrire le code dans ton coffre GitHub."
    quoi: "Dans Claude, clique sur « Code » dans le menu de gauche. Suis les boutons pour connecter GitHub et installer l'application Claude. Quand on te demande quels dépôts autoriser, choisis « All repositories »."
  - type: action
    titre: "Crée ton projet Claude « Mes sites »"
    objectif: "Régler Claude une fois pour toutes pour qu'il t'explique tout simplement."
    quoi: |
      Dans Claude : Projets → Nouveau projet → nomme-le « Mes sites ».
      Dans les instructions du projet, colle ce texte :
      [À COPIER] Je suis débutant complet, je ne sais pas coder. Parle-moi en français, simplement, sans jargon. Donne-moi une seule chose à faire à la fois et dis-moi exactement où cliquer. Quand il y a plusieurs solutions, choisis la plus simple et la gratuite sans me demander. N'utilise jamais de service payant. Pour héberger un site, utilise Cloudflare Pages. Pour enregistrer des données, utilise Cloudflare D1, sauf si le propriétaire doit ajouter des photos lui-même : alors utilise Supabase.
  - type: recap
    points:
    - "Tu as tes 3 comptes : Claude, GitHub, Cloudflare"
    - "Claude peut écrire le code de tes sites dans GitHub"
    - "Ton projet « Mes sites » est réglé pour t'expliquer simplement"

- titre: "Chapitre 1 · SCOPE du cahier des charges"
  objectif: "Délimiter le projet du client."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "Le chapitre 0 est terminé"
    - "J'ai discuté avec mon client et j'ai mes notes"
  - type: action
    titre: "Ouvre une conversation"
    objectif: "Avoir un endroit où écrire le cahier des charges."
    quoi: "Ouvre une conversation CHAT avec Claude, dans ton projet « Mes sites ». Garde-la ouverte : tu y reviendras au chapitre 2."
  - type: action
    titre: "Écris ce que veut ton client"
    objectif: "Tout sortir de ta tête."
    quoi: "Note dans le chat toutes les fonctionnalités que veut ton client, en vrac, avec tes mots. N'envoie pas encore : on vérifie d'abord."
  - type: verif
    question: "T'as pensé au nom du site ?"
    si_non: "Ajoute-le. Si le client n'a pas d'idée, écris « propose-moi 5 noms »."
  - type: verif
    question: "T'as pensé à lui demander des sites références ?"
    si_non: "Ajoute des liens de sites qu'il aime. 3 maximum."
  - type: verif
    question: "T'as listé tout ce que le PROPRIÉTAIRE du site doit pouvoir faire ?"
    si_non: "Ajoute-le. Exemples : modifier les textes, ajouter des photos de ses produits, lire les messages reçus, voir les réservations, changer les horaires."
  - type: verif
    question: "T'as listé tout ce que le VISITEUR du site doit pouvoir faire ?"
    si_non: "Ajoute-le. Exemples : voir les services et les prix, envoyer un message, réserver, trouver l'adresse."
  - type: verif
    question: "T'as les textes, le logo, les photos et les couleurs ?"
    si_non: "Demande-les au client. En attendant, écris « invente des textes et des images provisoires »."
  - type: action
    titre: "Fais-toi interroger par Claude"
    objectif: "Trouver ce que tu as oublié."
    quoi: |
      Ajoute cette phrase à la fin de ton message puis envoie :
      [À COPIER] Voici le cahier des charges du site de mon client. Pose-moi une par une les questions importantes qui manquent, puis attends mes réponses.
      Réponds à ses questions. Si tu ne sais pas, réponds « choisis le plus simple ».
  - type: action
    titre: "Demande le prompt pour Claude Code"
    objectif: "Transformer ton cahier des charges en consigne parfaite."
    quoi: |
      Envoie ce message dans la même conversation :
      [À COPIER] Rédige maintenant un prompt détaillé pour que Claude Code crée ce site. Contraintes obligatoires à recopier dans le prompt : uniquement des outils gratuits ; site simple en HTML, CSS et JavaScript, sans étape de build, rangé dans le dossier « public » ; parfait sur téléphone ; hébergé sur Cloudflare Pages ; aucun réglage ni variable secrète à faire à la main ; Claude Code travaille en autonomie, sans me poser de questions techniques, et m'explique simplement ce qu'il a fait. Choisis aussi le stockage, le plus simple possible. Si le site n'enregistre rien : aucun. S'il enregistre des données mais que le propriétaire n'ajoute pas de photos : Cloudflare D1, avec des Pages Functions dans le dossier « functions », une liaison nommée DB déclarée dans wrangler.toml (avec pages_build_output_dir = "public"), des tables qui se créent toutes seules au premier lancement, l'identifiant de la base que je donnerai dans mon message, et si le propriétaire a besoin d'un mot de passe, Claude Code le choisit et me le donne à la fin. Si le propriétaire doit ajouter des photos lui-même : Supabase (base, stockage des photos, connexion du propriétaire), et à la fin de son travail Claude Code me donne, dans un bloc à copier, le message exact à coller dans une conversation Claude qui a le connecteur Supabase pour créer le projet gratuit, ses tables, le stockage des photos et les règles de sécurité, et qui me rendra l'URL du projet, la clé publishable et la façon dont le propriétaire se connecte. Termine ta réponse par une seule de ces phrases, exactement : « Stockage : aucun », « Stockage : Cloudflare D1 » ou « Stockage : Supabase ».
  - type: action
    titre: "Copie le prompt"
    objectif: "L'avoir prêt à coller."
    quoi: "Clique sur le bouton Copier sous la réponse de Claude. Retiens aussi sa dernière phrase : « Stockage : aucun », « Stockage : Cloudflare D1 » ou « Stockage : Supabase »."
  - type: recap
    points:
    - "Tu as délimité le projet : nom, références, fonctions du propriétaire et du visiteur"
    - "Claude t'a posé les questions qui manquaient"
    - "Tu as un prompt complet, copié, prêt pour Claude Code"

- titre: "Chapitre 2 · Création du MVP"
  objectif: "Faire fabriquer la première version du site par Claude Code."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "Mon prompt est copié"
    - "GitHub est relié à Claude Code (chapitre 0)"
  - type: action
    titre: "Crée le coffre du site"
    objectif: "Un dépôt GitHub = un site."
    quoi: "Va sur github.com/new. Nom : celui du site, en minuscules, sans espace ni accent (ex. pizzeria-luigi). Choisis « Private », coche « Add a README file », puis « Create repository »."
  - type: action
    titre: "Ouvre Claude Code sur ton dépôt"
    objectif: "Dire à Claude où travailler."
    quoi: "Dans Claude, clique sur « Code » dans le menu de gauche. Dans la zone de message, sélectionne le dépôt que tu viens de créer."
  - type: action
    titre: "Colle ton prompt"
    objectif: "Préparer la commande."
    quoi: "Colle ton prompt dans la zone de message de Claude Code. N'envoie pas encore : on vérifie un détail juste après."
  - type: choix
    id: besoin_base
    question: "Quel stockage pour ton site ?"
    quoi: "Regarde la dernière phrase de Claude à la fin du chapitre 1 (« Stockage : … ») et touche le même mot."
    options:
    - label: "Aucun"
      goto: envoyer
    - label: "Cloudflare D1"
      goto: d1_creer
    - label: "Supabase"
      goto: sb_compte
    - label: "Je ne sais plus"
      goto: base_question
  - type: action
    id: base_question
    titre: "Demande à Claude"
    objectif: "Retrouver le stockage choisi pour ton site."
    quoi: |
      Retourne dans ta conversation du chapitre 1 (dans « Mes sites ») et envoie :
      [À COPIER] Quel stockage as-tu choisi pour ce site ? Réponds juste : aucun, Cloudflare D1 ou Supabase.
      Puis reviens ici.
    apres: besoin_base
  - type: action
    id: d1_creer
    titre: "Crée la base de données"
    objectif: "La mémoire de ton site (messages, réservations…), chez Cloudflare."
    quoi: |
      Ouvre dash.cloudflare.com dans un nouvel onglet. Menu de gauche : « Storage & databases » → « D1 SQL database » → « Create Database ».
      Nom : le même que ton dépôt (ex. pizzeria-luigi). Ne touche à rien d'autre et clique « Create ».
  - type: action
    titre: "Donne-la à Claude Code"
    objectif: "Relier ton site à sa base."
    quoi: |
      1. Copie cette phrase et colle-la à la fin de ton message dans Claude Code :
      [À COPIER] Voici l'identifiant de ma base Cloudflare D1 :
      2. Dans l'onglet Cloudflare, sur la page de ta base, copie le « Database ID » (une longue suite de lettres et de chiffres) et colle-le juste après la phrase.
  - type: action
    id: envoyer
    titre: "Envoie et laisse Claude travailler"
    objectif: "Obtenir la première version."
    quoi: |
      Envoie ton message. Attends, ça peut prendre plusieurs minutes. S'il te pose une question que tu ne comprends pas, réponds « choisis le plus simple pour moi ».
      S'il te donne un mot de passe à la fin, note-le : c'est celui du propriétaire du site.
      Réponds Oui ici quand il annonce qu'il a terminé.
    apres: publier_code
  - type: action
    id: sb_compte
    titre: "Compte Supabase"
    objectif: "Supabase garde les photos et les données de ton site."
    quoi: "Ouvre supabase.com dans un nouvel onglet, clique « Start your project » puis « Continue with GitHub ». Choisis toujours le plan gratuit (Free). Déjà fait pour un autre site ? Réponds Oui."
  - type: action
    titre: "Ajoute le connecteur Supabase"
    objectif: "Permettre à Claude de créer la base tout seul."
    quoi: "Dans Claude : Réglages → Connecteurs → cherche « Supabase » → Connecter, puis accepte. Déjà fait pour un autre site ? Réponds Oui."
  - type: action
    titre: "Envoie ton message à Claude Code"
    objectif: "Obtenir la première version."
    quoi: |
      Reviens dans Claude Code et envoie ton message. Attends, ça peut prendre plusieurs minutes. S'il te pose une question que tu ne comprends pas, réponds « choisis le plus simple pour moi ».
      À la fin, il te donne un message à copier pour créer la base : clique sur son bouton Copier.
      Réponds Oui ici quand c'est copié.
  - type: action
    titre: "Fais créer la base par Claude"
    objectif: "Claude crée la base et le stockage des photos tout seul."
    quoi: "Dans Claude, ouvre une nouvelle conversation CHAT dans « Mes sites », colle le message et envoie. Accepte les autorisations Supabase quand on te les demande. Le prix affiché doit être 0 : sinon, appuie sur À l'aide. Le plan gratuit permet 2 projets actifs."
  - type: action
    titre: "Donne les clés à Claude Code"
    objectif: "Brancher le site sur sa base."
    quoi: |
      Quand Claude a fini, copie toute sa réponse (elle contient l'URL du projet et la clé « publishable »), colle-la dans Claude Code et envoie.
      Ne recopie jamais une clé appelée « secret » ou « service_role ».
      Note comment le propriétaire se connecte. Réponds Oui quand Claude Code a terminé.
  - type: action
    id: publier_code
    titre: "Enregistre le travail dans GitHub"
    objectif: "Ranger le code dans le coffre."
    quoi: "Dans Claude Code, clique sur « Create PR » (ou demande « crée la pull request »). Ouvre le lien, puis sur GitHub clique « Merge pull request » et « Confirm merge »."
  - type: recap
    points:
    - "Tu as créé le dépôt GitHub du site"
    - "Claude Code a fabriqué la première version"
    - "Ta base de données est prête, chez Cloudflare ou Supabase (si ton site en a besoin)"
    - "Le code est rangé dans GitHub"

- titre: "Chapitre 3 · Mise en ligne"
  objectif: "Avoir un vrai lien à ouvrir depuis n'importe où."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "J'ai cliqué « Merge pull request » sur GitHub"
    - "Je suis connecté à Cloudflare"
  - type: action
    titre: "Crée le projet Cloudflare"
    objectif: "Relier Cloudflare à ton dépôt."
    quoi: "Sur dash.cloudflare.com : « Workers & Pages » → « Create » → choisis « Pages » → « Connect to Git ». Si tu ne vois pas « Pages », cherche en bas de l'écran le lien qui parle de Pages."
  - type: action
    titre: "Choisis le dépôt"
    objectif: "Dire à Cloudflare quel site publier."
    quoi: "Autorise GitHub si on te le demande, sélectionne le dépôt de ton site, puis « Begin setup »."
  - type: action
    titre: "Lance la mise en ligne"
    objectif: "Publier."
    quoi: "Branche : main. Laisse « Build command » vide. Dans « Build output directory », écris « public ». Clique « Save and Deploy », puis attends la fin (1 à 2 minutes)."
  - type: verif
    question: "Ouvre le lien qui finit par .pages.dev : ton site s'affiche ?"
    si_non: "Copie le message d'erreur de Cloudflare, colle-le dans Claude Code et écris « corrige ». Refais ensuite « Create PR » puis « Merge », attends 1 minute et recharge."
  - type: recap
    points:
    - "Ton site est en ligne, gratuitement"
    - "À chaque « Merge » sur GitHub, le site se met à jour tout seul"

- titre: "Chapitre 4 · Tester et corriger"
  objectif: "Un site sans bug avant de le montrer."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "Mon site est en ligne"
    - "J'ai mon cahier des charges sous les yeux"
    - "J'ai un téléphone pour tester"
  - type: action
    id: test_ordi
    titre: "Teste sur ordinateur"
    objectif: "Vérifier chaque fonctionnalité."
    quoi: |
      Reprends ton cahier des charges ligne par ligne et essaie tout : chaque bouton, chaque page, chaque formulaire.
      Si ton site enregistre des données, fais un vrai essai (envoie un message, réserve, ajoute une photo depuis l'espace du propriétaire) et vérifie que tout s'affiche bien.
  - type: action
    titre: "Teste sur téléphone"
    objectif: "La plupart des visiteurs seront sur téléphone."
    quoi: "Ouvre le lien sur ton téléphone et refais les mêmes essais."
  - type: choix
    question: "Alors ?"
    options:
    - label: "Tout marche et c'est beau"
      goto: recap_test
    - label: "Il y a un bug ou un truc moche"
      goto: corriger
  - type: action
    id: corriger
    titre: "Explique le problème à Claude Code"
    objectif: "Une correction précise."
    quoi: |
      Dans la même conversation Claude Code, écris :
      [À COPIER] Problème : ce que j'ai fait → … / ce que j'attendais → … / ce qui se passe → …
      Ajoute une capture d'écran. Un seul problème par message.
  - type: action
    titre: "Publie la correction"
    objectif: "Mettre le site à jour."
    quoi: "« Create PR » → « Merge pull request » → attends 1 minute → recharge ton site."
    apres: test_ordi
  - type: recap
    id: recap_test
    points:
    - "Tu as testé sur ordinateur et sur téléphone"
    - "Tu sais décrire un bug à Claude et publier une correction"

- titre: "Chapitre 5 · Livraison au client"
  objectif: "Un client content, un site livré."
  etapes:
  - type: prerequis
    titre: "Avant de commencer"
    cases:
    - "Tout marche sur ordinateur et téléphone"
    - "J'ai le lien du site"
  - type: action
    id: envoi_client
    titre: "Montre le site au client"
    objectif: "Recueillir ses retours."
    quoi: "Envoie-lui le lien et demande-lui tous ses retours en une seule liste."
  - type: choix
    question: "Le client veut des modifications ?"
    options:
    - label: "Oui"
      goto: modifs
    - label: "Non, il valide"
      goto: mode_emploi
  - type: action
    id: modifs
    titre: "Fais les modifications"
    objectif: "Appliquer sa liste."
    quoi: "Colle la liste du client dans Claude Code, puis « Create PR » → « Merge ». Vérifie toi-même le résultat avant de le remontrer."
    apres: envoi_client
  - type: verif
    id: mode_emploi
    question: "Le propriétaire sait utiliser sa partie du site ?"
    si_non: "Demande à Claude (Chat) : « écris un mode d'emploi d'une page pour le propriétaire du site », et envoie-le au client avec son mot de passe."
  - type: action
    titre: "Range ton dossier client"
    objectif: "Retrouver tout dans 6 mois."
    quoi: "Note dans un document : le nom du client, le lien du site, le nom du dépôt GitHub, la façon dont le propriétaire se connecte. Si le site utilise Supabase : le projet gratuit se met en pause s'il ne reçoit aucune visite pendant une semaine ; si les photos ne s'affichent plus, va sur supabase.com, ouvre le projet et clique « Restore ». Un nom de domaine personnalisé (ex. monsite.fr) est payant : c'est au client de l'acheter s'il en veut un."
  - type: recap
    points:
    - "Le client a validé son site"
    - "Il sait s'en servir"
    - "Tu as livré ton premier site. Pour le prochain, touche « Commencer un nouveau site » : tes outils sont déjà prêts."
